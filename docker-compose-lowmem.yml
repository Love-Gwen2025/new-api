# New-API Docker Compose - 小内存服务器优化版
# 适用于 1核2G + 4G swap 服务器
#
# 使用方式 (1Panel):
#   1. 容器 → 编排 → 创建编排，名称填 newapi
#   2. 粘贴本文件内容
#   3. 点击"编辑环境变量"，添加:
#      POSTGRES_PASSWORD=你的数据库密码
#      SESSION_SECRET=随机字符串32位以上
#      CRYPTO_SECRET=随机字符串32位以上
#   4. 确认启动，访问 http://服务器IP:3000
#
# 生成随机密钥: openssl rand -hex 32
#
# 注意: 1Panel 会将环境变量写入 1panel.env，本文件已配置 env_file 引用
#
# 内存分配说明 (总计约 2.2GB，可借助 swap):
#   - new-api: 1GB
#   - postgres: 768MB
#   - redis: 256MB
#   - watchtower: 64MB

services:
  new-api:
    image: ghcr.io/love-gwen2025/new-api:latest
    container_name: newapi-app
    restart: always
    env_file:
      - 1panel.env
    labels:
      - "com.centurylinklabs.watchtower.scope=newapi"
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # === 数据库配置 ===
      - SQL_DSN=postgresql://newapi:${POSTGRES_PASSWORD}@newapi-postgres:5432/newapi
      - SQL_MAX_IDLE_CONNS=50
      - SQL_MAX_OPEN_CONNS=100
      - SQL_MAX_LIFETIME=60

      # === Redis 配置 ===
      - REDIS_CONN_STRING=redis://newapi-redis:6379

      # === 安全配置 (200人场景必须设置) ===
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}

      # === 性能配置 ===
      - BATCH_UPDATE_ENABLED=true
      - BATCH_UPDATE_INTERVAL=5
      - MEMORY_CACHE_ENABLED=true
      - SYNC_FREQUENCY=60
      - CHANNEL_UPDATE_FREQUENCY=60

      # === 超时配置 ===
      - STREAMING_TIMEOUT=300
      - RELAY_TIMEOUT=120

      # === 日志配置 ===
      - ERROR_LOG_ENABLED=true

      # === 其他 ===
      - TZ=Asia/Shanghai
      - GET_MEDIA_TOKEN=true
    depends_on:
      newapi-postgres:
        condition: service_healthy
      newapi-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  newapi-redis:
    image: redis:7-alpine
    container_name: newapi-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - ./redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  newapi-postgres:
    image: postgres:15-alpine
    container_name: newapi-postgres
    restart: always
    env_file:
      - 1panel.env
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newapi
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    # PostgreSQL 配置 (针对小内存 + swap 优化)
    command: >
      postgres
      -c timezone=Asia/Shanghai
      -c shared_buffers=192MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c work_mem=8MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d newapi"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  newapi-watchtower:
    image: containrrr/watchtower
    container_name: newapi-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_SCOPE=newapi
      - DOCKER_API_VERSION=1.44
    command: --scope newapi
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    labels:
      - "com.centurylinklabs.watchtower.scope=newapi"

# 数据目录结构:
#   ./data/       - new-api 应用数据
#   ./logs/       - new-api 日志
#   ./pg_data/    - PostgreSQL 数据
#   ./redis_data/ - Redis 数据 (可选，当前配置未持久化)
#
# 迁移: 打包整个目录即可
#   tar -czvf newapi-backup.tar.gz data logs pg_data .env
